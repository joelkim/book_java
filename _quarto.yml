project:
  type: website
  render:
    - "*.ipynb"

format:
  html:
    toc: true
    toc-depth: 5
    css: styles.css
    page-layout: full
    code-block-bg: true
    code-overflow: wrap
    code-line-numbers: false
    monofont: D2Coding
    language:
      crossref-tbl-title: "표"
    mermaid:
      theme: neutral
    filters:
      - clean-code.lua

bibliography: references.bib
reference-location: margin

website:
  title: "Java Book"
  site-url: https://javabook.madebykim.kr/
  sidebar:
    style: "docked"
    search: true
    contents:
      - "index.ipynb"
      - section: "개발환경"
        contents:
        - "devenv/install.ipynb"
        - "devenv/jshell.ipynb"
      - section: "언어"
        contents:
        - "lang/forloop.ipynb"
        - "lang/callarg.ipynb"
      - section: "빌드"
        contents:
        - "build/gradle.ipynb"
        - "build/maven.ipynb"
